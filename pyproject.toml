[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-spotdl"
version = "0.1.0"
description = "High-reliability Spotify & YouTube audio downloader with deep recursive duplicate detection and DJ metadata tagging."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DJ Tools" }
]
dependencies = [
    "yt-dlp>=2024.8.6",
    "spotipy>=2.24.0",
    "mutagen>=1.47.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.7",
    "mypy>=1.11.1",
]

[project.scripts]
dj-dl = "dj_downloader.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_downloader"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
